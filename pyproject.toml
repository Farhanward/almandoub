[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almandoub"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Local customer-messages agent."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
almandoub = "almandoub.cli:main"

[tool.setuptools]
packages = ["almandoub"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
